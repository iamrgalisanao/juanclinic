services:
  web:
    image: webdevops/php-apache:8.3
    container_name: bustamanteclinic-web
    restart: unless-stopped
    working_dir: /app
    ports:
      - "80:80"
    volumes:
      - ./juanclinic:/app
    environment:
      WEB_DOCUMENT_ROOT: /app/public
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    container_name: bustamanteclinic-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: juanclinic
      MYSQL_USER: bustamanteclinic
      MYSQL_PASSWORD: strongpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: bustamanteclinic-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: